
apiVersion: audit.k8s.io/v1
kind: Policy

omitStages:
  - RequestReceived

rules:
  - level: Metadata
    resources:
      - group: ""
        resources: ["secrets"]

  - level: Metadata
    resources:
      - group: "rbac.authorization.k8s.io"
        resources: ["clusterrolebindings"]

  - level: None
